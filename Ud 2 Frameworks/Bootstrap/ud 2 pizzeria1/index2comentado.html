
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!--
        Adapta la página a diferentes tamaños de pantalla.

        width=device-width:
        Utiliza el ancho del dispositivo.

        initial-scale=1:
        Establece la escala inicial normal.

        Es importante para los diseños responsive.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Botón con Bootstrap</title>

    <!--
        CARGAMOS BOOTSTRAP

        Hasta ahora enlazábamos nuestro propio CSS:

        <link rel="stylesheet" href="estilos.css">

        Ahora cargamos una hoja de estilos de Bootstrap
        que ya contiene muchas clases CSS preparadas.

        CDN: servidor desde el que descargamos el archivo.

        bootstrap@5.3.3: versión que utilizamos.
        bootstrap.min.css: archivo CSS comprimido.
        rel="stylesheet": indica que es una hoja de estilos.

        No necesitamos escribir nosotros todas las
        propiedades CSS de botones, fondos, etc.
    -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<!--
    BODY: contenido visible de la página.

    Aplicamos DOS clases de Bootstrap:

    p-4:
        p = padding (espacio interior).
        4 = nivel de espaciado de Bootstrap.

        Equivale aproximadamente a:
        padding: 24px;

    bg-light:
        bg = background (fondo).
        light = color claro.

        Equivale aproximadamente a:
        background-color: #f8f9fa;

    Las clases se separan mediante espacios.
-->
<body class="p-4 bg-light">

    <!--
        TÍTULO PRINCIPAL

        h1 es una etiqueta HTML normal.

        text-danger es una clase de Bootstrap
        que aplica el color rojo al texto.

        Con CSS tradicional escribiríamos:

        h1 {
            color: #dc3545;
        }

        Bootstrap ya tiene ese estilo definido.
    -->
    <h1 class="text-danger">
        Pizzería La Plaza
    </h1>

    <!--
        PÁRRAFO

        No necesita clases especiales.
        Bootstrap aplica también algunos estilos
        generales a las etiquetas HTML.
    -->
    <p>Haz tu pedido en un clic.</p>

    <!--
        BOTÓN

        Utilizamos DOS clases:

        btn:
            Aplica el estilo básico de un botón:
            - Espaciado interior (padding).
            - Bordes.
            - Bordes redondeados.
            - Tipografía.
            - Efectos visuales.

        btn-warning:
            Aplica la variante amarilla.

        OTRAS VARIANTES:

        btn-primary -> azul.
        btn-success -> verde.
        btn-danger  -> rojo.
        btn-warning -> amarillo.

        Para cambiar el color solo necesitamos
        cambiar la clase del botón.

        No tenemos que modificar ningún CSS.

        IMPORTANTE:
        Este botón todavía no realiza ninguna acción
        al pulsarlo. Solo estamos trabajando su diseño.
    -->
    <button class="btn btn-warning">
        Pedir pizza
    </button>

</body>
</html>
