<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta de producto</title>
  <!-- Tailwind CSS 4: CDN de aprendizaje, no para producción -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <main class="p-8">
    <!-- max-w-xs limita el ancho; p-6 añade relleno interior -->
    <article class="max-w-xs mx-auto bg-white p-6 rounded-xl shadow-lg">
      <h1 class="text-xl font-bold text-gray-900">Auriculares inalámbricos</h1>
      <p class="mt-2 text-gray-600">Auriculares Bluetooth con batería de larga duración.</p>
      <p class="mt-4 text-2xl font-bold text-blue-700">49,99 €</p>
      <button class="mt-4 w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Comprar</button>
    </article>
  </main>
</body>
</html>
