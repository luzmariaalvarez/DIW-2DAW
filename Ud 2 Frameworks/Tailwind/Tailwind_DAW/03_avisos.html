<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colores y avisos</title>
  <!-- Tailwind CSS 4: CDN de aprendizaje, no para producción -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <main class="p-8 max-w-xl mx-auto space-y-4">
    <h1 class="text-2xl font-bold">Mensajes informativos</h1>
    <p class="bg-green-100 text-green-800 p-4 rounded">Operación realizada correctamente.</p>
    <p class="bg-red-100 text-red-800 p-4 rounded">Se ha producido un error.</p>
    <p class="bg-blue-100 text-blue-800 p-4 rounded">Tienes una notificación nueva.</p>
  </main>
</body>
</html>
